<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Assistant | Spatial UI Studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          backdropBlur: {
            '2xl': '40px',
            '3xl': '64px',
          },
          boxShadow: {
            'glass-card': '0 8px 32px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3)',
            'glass-glow': '0 0 25px 3px rgba(6, 182, 212, 0.45)',
            'glass-input': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
          },
          animation: {
            'liquid-blob': 'blob 10s infinite ease-in-out',
            'liquid-blob-delayed': 'blob 10s infinite ease-in-out 4s',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.15)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
            },
          },
        },
      },
    };
  </script>

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .text-gradient-iridescent {
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      background-image: linear-gradient(to right, #22d3ee, #818cf8, #e879f9);
    }

    .glass-panel {
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2), 0 1px 1px 0 rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body
  class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Atmospheric Background Component
    function LiquidBackground() {
      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
          <div className="absolute inset-0 bg-slate-950 transition-colors duration-500" />
          <div className="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-cyan-500/25 blur-3xl animate-liquid-blob" />
          <div className="absolute top-1/3 -right-20 w-[30rem] h-[30rem] rounded-full bg-fuchsia-600/20 blur-3xl animate-liquid-blob-delayed" />
          <div className="absolute -bottom-32 left-1/3 w-[32rem] h-[32rem] rounded-full bg-indigo-600/25 blur-3xl animate-liquid-blob" />
          <div
            className="absolute inset-0 opacity-[0.05]"
            style={{
              backgroundImage: 'radial-gradient(rgba(255, 255, 255, 0.8) 1px, transparent 1px)',
              backgroundSize: '24px 24px',
            }}
          />
        </div>
      );
    }

    // App Studio Container
    function StudioApp() {
      const [messages, setMessages] = useState([
        {
          id: '1',
          role: 'model',
          message: `### 🌟 Welcome to the AI Career Assistant Studio!

I am your real-time **ATS Resume Reviewer**, **Technical Interview Coach**, and **Software Engineering Career Strategist** powered by **Google Gemini 2.5 Flash**.

#### 🎯 What I can do for you:
1. **ATS Match Score & Diagnostics**: Paste your Resume & Job Description to see match percentages and missing keywords.
2. **STAR-Method Bullet Rewrites**: Transform passive resume lines into measurable achievements.
3. **Structured Skill Roadmaps**: Generate step-by-step technical learning pathways.
4. **Technical Interview Preparation**: Practice mock questions tailored to your target company.

*Try selecting one of the suggested prompts below or attach your resume context!*`,
        },
      ]);
      const [input, setInput] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [resumeText, setResumeText] = useState('Senior Full-Stack Software Engineer with 5+ years experience in React, TypeScript, Node.js Express, Supabase PostgreSQL, and REST API architecture.');
      const [jobDescription, setJobDescription] = useState('Looking for a Lead AI Engineer proficient in Google Gemini API streaming, real-time SSE architectures, Tailwind CSS glassmorphism UI, and PostgreSQL RLS.');
      const [showContextModal, setShowContextModal] = useState(false);
      const [showAtsAudit, setShowAtsAudit] = useState(false);
      const [showRoadmap, setShowRoadmap] = useState(false);
      const [theme, setTheme] = useState('dark');

      const endRef = useRef(null);

      useEffect(() => {
        endRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isStreaming, showAtsAudit, showRoadmap]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const handleSend = (textToSend) => {
        const msgText = textToSend || input;
        if (!msgText.trim() || isStreaming) return;

        const userMsg = { id: Date.now().toString(), role: 'user', message: msgText };
        setMessages((prev) => [...prev, userMsg]);
        setInput('');
        setIsStreaming(true);

        setTimeout(() => {
          let reply = '';
          if (msgText.toLowerCase().includes('ats') || msgText.toLowerCase().includes('resume')) {
            reply = `### 📊 ATS Optimization Analysis\n\nBased on your attached resume and target Job Description:\n\n- **Target Match Rating**: **88% High Match**\n- **Key Strengths**: React, TypeScript, Node.js, REST APIs\n- **Missing High-Priority Keywords**: *Google Gemini API*, *Server-Sent Events (SSE)*, *Tailwind Glassmorphism*\n\n> **Recommended Bullet Rewrite**:\n> *"Architected a real-time SSE streaming backend using Node.js & Gemini 2.5 Flash, reducing prompt response latency by 42% for multi-tenant users."*\n\nClick **"Run ATS Audit"** in the sidebar to view your detailed visual dial diagnostic!`;
          } else if (msgText.toLowerCase().includes('roadmap') || msgText.toLowerCase().includes('skill')) {
            reply = `### 🗺️ Technical Skill Acquisition Roadmap\n\nHere is your custom 12-week transition pathway toward **Lead AI Engineer**:\n\n1. **Weeks 1-4: Advanced LLM Integration & SSE Streaming**\n   - Master \`@google/genai\` SDK streaming endpoints & system instruction design.\n   - Build high-throughput Express Server-Sent Events gateway.\n2. **Weeks 5-8: Spatial UI & Dynamic Blur Physics**\n   - Implement backdrop blur tokens, gradient mesh keyframe animations, and specular highlights.\n3. **Weeks 9-12: Cloud Database & Row-Level Security**\n   - Deploy Supabase PostgreSQL schema with strict JWT RLS policies.\n\nClick **"Build Roadmap"** in the sidebar for interactive timeline steps!`;
          } else {
            reply = `### 💡 Career Strategy Insights\n\nThank you for asking! Grounded in your software engineering context, I recommend focusing on three core vectors:\n\n1. **Demonstrate System Architecture**: Highlight real-time streaming & state management.\n2. **Quantify Achievements**: Ensure every resume bullet follows the *Action Verb + Tech Stack + Measurable Outcome* format.\n3. **Build High-Impact Artifacts**: Package your applications with sleek VisionOS spatial aesthetics to impress hiring managers.\n\nWould you like me to generate mock technical interview questions or refine your cold outreach message?`;
          }

          setMessages((prev) => [...prev, { id: (Date.now() + 1).toString(), role: 'model', message: reply }]);
          setIsStreaming(false);
        }, 1200);
      };

      return (
        <div className="relative min-h-screen flex z-10">
          {/* Floating Glass Sidebar */}
          <aside className="w-80 bg-slate-900/60 backdrop-blur-2xl border-r border-white/10 p-4 flex flex-col justify-between hidden md:flex" >
            <div className="space-y-4">
              <div className="flex items-center gap-2.5 px-2 py-1">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">
                  AI
                </div>
                <div>
                  <h2 className="font-bold text-sm text-slate-100 font-heading">Career Studio</h2>
                  <span className="text-[10px] text-cyan-400 font-mono">v2.5 Enterprise</span>
                </div>
              </div>           </div>

            <button
              onClick={() => setMessages([messages[0]])}
              className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-gradient-to-r from-cyan-500 via-indigo-500 to-fuchsia-500 hover:brightness-110 text-white font-medium text-xs rounded-xl shadow-lg border border-white/20 transition-all"
            >
              <span>+ New Career Session</span>
            </button>

            <div className="space-y-2 pt-2">
              <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider px-2">Structured Tools</span>
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => setShowAtsAudit(!showAtsAudit)}
                  className="p-2 bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 rounded-xl border border-white/15 backdrop-blur-sm transition-all text-center"
                >
                  🎯 ATS Audit
                </button>
                <button
                  onClick={() => setShowRoadmap(!showRoadmap)}
                  className="p-2 bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 rounded-xl border border-white/15 backdrop-blur-sm transition-all text-center"
                >
                  🧭 Roadmap
                </button>
              </div>
            </div>

            <div className="pt-2">
              <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider px-2">Active Context</span>
              <div
                onClick={() => setShowContextModal(true)}
                className="mt-1 p-3 bg-cyan-500/10 border border-cyan-400/30 rounded-xl text-xs space-y-1 cursor-pointer hover:bg-cyan-500/20 transition-all"
              >
                <div className="font-bold text-cyan-300">📄 Resume & JD Attached</div>
                <div className="text-[11px] text-slate-300 truncate">Senior Full-Stack Engineer</div>
              </div>
            </div>
        </div>

              {/* User Footer */ }
      <div className="pt-4 border-t border-white/10 flex items-center justify-between text-xs text-slate-300">
        <span className="truncate">demo.engineer@ai.com</span>
        <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono text-[10px]">Active</span>
      </div>
            </aside >

        {/* Main Spatial Chat Window */ }
        < main className = "flex-1 flex flex-col h-screen overflow-hidden" >
          {/* Header */ }
          < header className = "px-6 py-4 bg-slate-900/40 backdrop-blur-2xl border-b border-white/10 flex items-center justify-between" >
                <div>
                  <h1 className="text-base font-bold text-slate-100 flex items-center gap-2 font-heading">
                    <span>AI Career Assistant & ATS Coach</span>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-mono">Gemini 2.5 Flash</span>
                  </h1>
                  <p className="text-xs text-slate-400">Spatial UI Architecture</p>
                </div>
                <button
                  onClick={() => setShowContextModal(true)}
                  className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-medium text-slate-200 border border-white/15 backdrop-blur-md"
                >
                  Edit Context Drawer
                </button>
              </header >

        {/* Messages Area */ }
        < div className = "flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto" >
        {
          messages.map((msg) => (
            <div key={msg.id} className={`flex items-start gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 ${msg.role === 'user' ? 'bg-gradient-to-r from-indigo-500 to-purple-600 text-white' : 'bg-slate-800 text-cyan-400 border border-cyan-400/30'}`}>
                {msg.role === 'user' ? 'U' : 'AI'}
              </div>
              <div className={`max-w-[80%] px-5 py-4 rounded-2xl text-sm leading-relaxed ${msg.role === 'user' ? 'bg-gradient-to-r from-indigo-500/80 to-purple-600/80 text-white rounded-tr-none' : 'glass-panel text-slate-100 rounded-tl-none'}`}>
                <div className="whitespace-pre-wrap">{msg.message}</div>
              </div>
            </div>
          ))
        }

      {
        isStreaming && (
          <div className="flex items-center gap-2 px-4 py-3 glass-panel rounded-2xl w-fit text-cyan-400 text-xs">
            <span className="animate-pulse">Gemini is thinking & streaming strategy...</span>
          </div>
        )
      }

      {/* ATS Widget Card Overlay */ }
      {
        showAtsAudit && (
          <div className="p-6 rounded-3xl glass-panel space-y-4 my-4">
            <div className="flex items-center justify-between border-b border-white/10 pb-2">
              <h3 className="font-bold text-lg text-slate-100">🎯 ATS Match & Diagnostic Gauge</h3>
              <button onClick={() => setShowAtsAudit(false)} className="text-slate-400 text-xs">✕ Close</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
              <div className="flex flex-col items-center justify-center p-4 bg-slate-800/50 rounded-2xl border border-white/10">
                <span className="text-4xl font-extrabold text-cyan-400">88%</span>
                <span className="text-[10px] text-slate-400 uppercase font-semibold">Match Score</span>
              </div>
              <div className="sm:col-span-2 space-y-2 text-xs">
                <div className="p-2 rounded bg-emerald-500/10 border border-emerald-400/20 text-emerald-300">
                  ✓ Key Strengths: React, TypeScript, Node.js, REST APIs
                </div>
                <div className="p-2 rounded bg-rose-500/10 border border-rose-400/20 text-rose-300">
                  ⚠ Missing Keywords: Google Gemini API, SSE Streaming, VisionOS Glassmorphism
                </div>
              </div>
            </div>
          </div>
        )
      }

      {/* Skill Roadmap Overlay */ }
      {
        showRoadmap && (
          <div className="p-6 rounded-3xl glass-panel space-y-4 my-4">
            <div className="flex items-center justify-between border-b border-white/10 pb-2">
              <h3 className="font-bold text-lg text-slate-100">🧭 12-Week Lead AI Engineer Roadmap</h3>
              <button onClick={() => setShowRoadmap(false)} className="text-slate-400 text-xs">✕ Close</button>
            </div>
            <div className="space-y-3 text-xs">
              <div className="p-3 bg-slate-800/40 rounded-xl border border-white/10">
                <div className="font-bold text-cyan-300">Phase 1: Real-Time SSE & Gemini 2.5 SDK (Weeks 1-4)</div>
                <div className="text-slate-300 mt-1">Master @google/genai streaming responses, system prompt grounding, and Node.js Express.</div>
              </div>
              <div className="p-3 bg-slate-800/40 rounded-xl border border-white/10">
                <div className="font-bold text-indigo-300">Phase 2: Spatial UI Systems (Weeks 5-8)</div>
                <div className="text-slate-300 mt-1">Implement backdrop blur tokens, specular highlights, and fluid animations.</div>
              </div>
            </div>
          </div>
        )
      }

      <div ref={endRef} />
              </div >

        {/* Bottom Input */ }
        < footer className = "p-4 bg-transparent" >
          <div className="max-w-4xl mx-auto flex items-center gap-2 p-2 glass-input rounded-2xl">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleSend()}
              placeholder="Ask AI Career Assistant or request ATS resume rewrites..."
              className="flex-1 bg-transparent px-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none"
            />
            <button
              onClick={() => handleSend()}
              className="px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-medium text-xs rounded-xl shadow-lg"
            >
              Send
            </button>
          </div>
              </footer >
            </main >

        {/* Context Drawer Modal */ }
      {
        showContextModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xl">
            <div className="w-full max-w-xl p-6 rounded-3xl glass-panel space-y-4">
              <div className="flex items-center justify-between border-b border-white/10 pb-3">
                <h3 className="font-bold text-base text-slate-100">📄 Resume & Job Description Context</h3>
                <button onClick={() => setShowContextModal(false)} className="text-slate-400 text-xs">✕ Close</button>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Resume Text</label>
                <textarea
                  rows={4}
                  value={resumeText}
                  onChange={(e) => setResumeText(e.target.value)}
                  className="w-full p-3 rounded-xl glass-input text-xs font-mono text-slate-200"
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1">Target Job Description</label>
                <textarea
                  rows={4}
                  value={jobDescription}
                  onChange={(e) => setJobDescription(e.target.value)}
                  className="w-full p-3 rounded-xl glass-input text-xs font-mono text-slate-200"
                />
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button
                  onClick={() => setShowContextModal(false)}
                  className="px-4 py-2 bg-gradient-to-r from-cyan-500 to-indigo-600 text-white text-xs font-medium rounded-xl"
                >
                  Save Context
                </button>
              </div>
            </div>
          </div>
        )
      }
          </div >
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <React.Fragment>
        <LiquidBackground />
        <StudioApp />
      </React.Fragment>
    );
  </script>
</body>

</html>
